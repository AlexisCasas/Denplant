name: PR26 controlled autofix

on:
  push:
    branches:
      - fix/pr26-production-baseline-ci-20261121

permissions:
  contents: write

concurrency:
  group: pr26-controlled-autofix
  cancel-in-progress: false

jobs:
  autofix:
    # A controlled one-time maintenance workflow for the named fix branch.
    # GITHUB_TOKEN pushes will not re-trigger workflows.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Python for Ruff and doc catalog regeneration
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Python code style
        run: |
          python -m pip install ruff==0.17.6
          ruff check backend/ --fix || true
          ruff format backend/

      - name: Refresh generated documentation
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://dental:testpass@localhost:5432/stub
          SECRET_KEY: ci-stub
          ENVIRONMENT: test
          TESTING: 'true'
        run: |
          python -m pip install -e '.[dev]'
          python scripts/generate_catalogs.py

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: JavaScript/Vue autoformat
        working-directory: frontend
        run: |
          npm ci
          npm run lint:fix || true

      - name: Review change summary and commit only known source trees
        run: |
          git diff --check
          git status --short
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/ frontend/ docs/modules-catalog.md docs/events-catalog.md
          if git diff --cached --quiet; then
            echo 'No auto-fix changes.'
          else
            git commit -m 'style(ci): apply Ruff and ESLint fixes and refresh catalogs'
            git push origin HEAD:fix/pr26-production-baseline-ci-20261121
          fi
