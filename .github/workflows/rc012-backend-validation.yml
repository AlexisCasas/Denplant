name: RC01.2 Backend Validation

on:
  push:
    branches: [ci/denplant-rc012-backend-validation]

permissions:
  contents: read

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.11.0
      - name: Run ruff check
        run: ruff check backend/
      - name: Run ruff format check
        run: ruff format --check backend/

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: dental_clinic_rc012_dev
          POSTGRES_USER: dental
          POSTGRES_PASSWORD: testpass
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://dental:testpass@localhost:5432/dental_clinic_rc012_dev
      TEST_DATABASE_URL: postgresql+asyncpg://dental:testpass@localhost:5432/dental_clinic_rc012_test
      SECRET_KEY: test-secret-key-for-ci
      ENVIRONMENT: test
      TESTING: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Create dedicated test database
        env:
          PGPASSWORD: testpass
        run: psql -h localhost -U dental -d dental_clinic_rc012_dev -c "CREATE DATABASE dental_clinic_rc012_test;"
      - name: Run tests (default set)
        working-directory: backend
        run: python -m pytest -v --tb=short
      - name: Alembic round-trip (base → head → base → head)
        working-directory: backend
        run: python -m pytest -v -m alembic_roundtrip --tb=short

  manifest-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Validate manifests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://dental:testpass@localhost:5432/stub
          TEST_DATABASE_URL: postgresql+asyncpg://dental:testpass@localhost:5432/stub_test
          SECRET_KEY: ci-stub
          ENVIRONMENT: test
          TESTING: "true"
        run: python -m pytest tests/test_module_manifest.py tests/test_module_manifests_consistency.py tests/test_manifest_validator.py tests/test_module_loader.py tests/test_module_docs.py -v --tb=short

  catalog-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Check catalogs are fresh
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://dental:testpass@localhost:5432/stub
          SECRET_KEY: ci-stub
          ENVIRONMENT: test
          TESTING: "true"
        run: python scripts/generate_catalogs.py --check
      - name: Check docs coverage (--strict)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://dental:testpass@localhost:5432/stub
          SECRET_KEY: ci-stub
          ENVIRONMENT: test
          TESTING: "true"
        run: python scripts/check_docs_coverage.py --strict
